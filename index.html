<style>
:root {
  /* KeelAI tokens. Light first; the navy scope below takes over in dark mode. The header is navy in both. */
  --bg: #F8F9FA;
  --bar: #1F3A5F;
  --card: #FFFFFF;
  --card-2: #F1F3F5;
  --rule: #E6E8EB;
  --rule-strong: #CBD0D7;
  --text: #233140;
  --strong: #1F3A5F;
  --muted: #475569;
  --faint: #5B6675;
  --ssp: #3B82F6;
  --ssp-t: #2563EB;
  --sbp: #B4842F;
  --pos: #2E7D5B;
  --neg: #B4453A;
  --gas: #f08a24;
  --gas-t: #A9530C;
  --above: #4D7F1E;
  --below: #7D6300;
  --sel-bg: #EBF3FE;
  --sel-t: #1F3A5F;
  --sel-b: #8FC0FB;
  --ctl-bg: #FFFFFF;
  --hover: #F1F3F5;
  --tip-bg: #FFFFFF;
  --err-bg: #F6E4E2;
  --err-b: rgba(180,69,58,0.35);
  --shadow: 0 1px 3px rgba(15,31,51,0.08), 0 1px 2px rgba(15,31,51,0.05);
  /* chart colours, read by the script when it draws */
  --c-ink: #1F3A5F;
  --c-halo: rgba(255,255,255,0.9);
  --c-hollow: #FFFFFF;
  --c-grid: rgba(31,58,95,0.08);
  --c-zero: rgba(31,58,95,0.3);
  --c-midnight: rgba(31,58,95,0.16);
  --c-hour: rgba(31,58,95,0.06);
  --c-guide: rgba(31,58,95,0.4);
  --c-hl: rgba(31,58,95,0.5);
  --c-above-bar: #6DB33F;
  --c-below-bar: #E2BE1C;
  --c-above-fill: rgba(109,179,63,0.30);
  --c-below-fill: rgba(226,190,28,0.38);
  --c-gas-edge: #9A4A0B;
  --c-hatch-bg: rgba(255,255,255,0.35);
  --c-hatch: rgba(31,58,95,0.28);
  --c-prov: rgba(31,58,95,0.55);
  --radius: 6px;
  color-scheme: light dark;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F1F33; --card: #1B3050; --card-2: #21385A; --rule: #2C456A; --rule-strong: #3C557B;
    --text: #E4EAF2; --strong: #FFFFFF; --muted: #B3C2D5; --faint: #8499B5;
    --ssp: #60A5FA; --ssp-t: #8FC0FB; --sbp: #E8C27A; --pos: #7FC4A2; --neg: #E58B82; --gas-t: #f08a24;
    --above: #7cc242; --below: #f5d63d;
    --sel-bg: #1E3A63; --sel-t: #FFFFFF; --sel-b: #4E709E; --ctl-bg: rgba(255,255,255,0.05); --hover: #21385A;
    --tip-bg: #0F1F33; --err-bg: #3A1B18; --err-b: rgba(229,139,130,0.45); --shadow: none;
    --c-ink: #E4EAF2; --c-halo: rgba(15,31,51,0.85); --c-hollow: #1B3050; --c-grid: rgba(255,255,255,0.08);
    --c-zero: rgba(255,255,255,0.22); --c-midnight: rgba(255,255,255,0.12); --c-hour: rgba(255,255,255,0.05);
    --c-guide: rgba(255,255,255,0.35); --c-hl: rgba(255,255,255,0.5); --c-above-bar: #7cc242; --c-below-bar: #f5d63d;
    --c-above-fill: rgba(124,194,66,0.26); --c-below-fill: rgba(245,214,61,0.28); --c-gas-edge: #ffd2a6;
    --c-hatch-bg: rgba(15,31,51,0.35); --c-hatch: rgba(228,234,242,0.28); --c-prov: rgba(228,234,242,0.6);
  }
}
*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; background: var(--bg); }
body {
  margin: 0; min-height: 100%;
  background: var(--bg); color: var(--text);
  font-family: "Segoe UI", "Open Sans", system-ui, -apple-system, Roboto, Arial, sans-serif;
  font-size: 15px; line-height: 1.4;
  font-variant-numeric: tabular-nums;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(96,165,250,0.45); }

/* Header */
.top {
  background: var(--bar); border-bottom: 1px solid #162942;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 14px 24px;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px));
}
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.klock { display: inline-flex; align-items: center; gap: 9px; line-height: 1; white-space: nowrap; }
.kmark { display: block; flex: none; width: 17px; height: 29px; }
.kword { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; color: #FFFFFF; }
.kword b { font-weight: 600; color: #60A5FA; }
.brand .sep { width: 1px; height: 22px; background: rgba(255,255,255,0.28); }
.brand .title { display: flex; align-items: center; gap: 8px; color: #FFFFFF; font-weight: 600; white-space: nowrap; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #60A5FA; flex: none; }
.dot.stale { background: #8499B5; }
.actions { display: flex; align-items: center; gap: 8px; flex: none; }
.updated { color: #B3C2D5; font-size: 13px; white-space: nowrap; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 6px; padding: 7px 12px; font-size: 14px; font-weight: 600;
  background: transparent; border: 1px solid rgba(255,255,255,0.32); color: #FFFFFF;
}
.btn svg { width: 14px; height: 14px; flex: none; }
.btn.export:hover { background: rgba(255,255,255,0.08); }
.btn.refresh { color: #0F1F33; border-color: #60A5FA; background: #60A5FA; }
.btn.refresh:hover { background: #8FC0FB; border-color: #8FC0FB; }
.custom .btn.refresh { color: #FFFFFF; border-color: #1F3A5F; background: #1F3A5F; }
.btn:disabled { opacity: 0.5; cursor: default; }
.spin svg { animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Page */
main { padding: 22px 24px 40px; max-width: 1480px; margin: 0 auto;
  padding-left: max(24px, env(safe-area-inset-left, 0px));
  padding-right: max(24px, env(safe-area-inset-right, 0px)); }

.controls { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; margin-bottom: 18px; }
.seg { display: flex; gap: 6px; }
.seg.periods { margin-left: auto; }
.seg button {
  border-radius: 6px; padding: 7px 14px; font-size: 14px; font-weight: 500;
  background: var(--ctl-bg); border: 1px solid var(--rule-strong); color: var(--muted);
  white-space: nowrap;
}
.seg button[aria-pressed="true"] { background: var(--sel-bg); color: var(--sel-t); border-color: var(--sel-b); font-weight: 600; }
.seg.prices button { font-weight: 600; }
.seg.prices button[data-key="systemSellPrice"][aria-pressed="true"] { color: var(--ssp-t); border-color: var(--ssp); background: var(--sel-bg); }
.short { display: none; }

.custom {
  display: none; flex-wrap: wrap; align-items: end; gap: 10px 14px;
  background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius);
  padding: 14px 16px; margin: -6px 0 18px;
}
.custom.open { display: flex; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.field input {
  background: var(--bg); border: 1px solid var(--rule-strong); border-radius: 6px;
  padding: 7px 10px; font-size: 15px; color: var(--text); min-width: 150px;
}
.custom .note { color: var(--neg); font-size: 13px; flex-basis: 100%; }
.custom .note:empty { display: none; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); padding: 14px 16px; min-height: 104px; }
.stat .label { color: var(--faint); font-size: 13px; font-weight: 500; letter-spacing: 0.02em; display: flex; align-items: center; gap: 6px; }
.stat.pick { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; }
.stat.pick:hover { border-color: var(--rule-strong); background: var(--hover); }
.stat.pick .caret { display: inline-block; transition: transform 0.15s; font-size: 10px; }
.stat.pick[aria-pressed="true"] { border-color: var(--ssp); background: var(--sel-bg); }
.stat.pick[aria-pressed="true"] .label { color: var(--text); }
.stat.pick[aria-pressed="true"] .caret { transform: rotate(90deg); }
.stat .value { font-size: 24px; font-weight: 600; margin-top: 2px; letter-spacing: -0.01em; color: var(--strong); }
.stat .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }
.stat .delta { font-size: 14px; margin-top: 4px; font-weight: 500; }
.up { color: var(--pos); } .down { color: var(--neg); }
.over { color: var(--above); } .under { color: var(--below); }

/* Chart */
.panel { background: var(--card); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 18px; }
.panel-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; padding: 14px 18px 4px; }
.panel-head h2 { margin: 0; font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; }
.head-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.budget { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.budget .box { display: flex; align-items: center; background: var(--bg); border: 1px solid var(--rule-strong); border-radius: 4px; padding: 0 8px; }
.budget .box:focus-within { border-color: var(--ssp); box-shadow: 0 0 0 3px rgba(96,165,250,0.30); }
.budget input:focus-visible { box-shadow: none; }
.budget input { width: 84px; background: transparent; border: 0; padding: 6px 4px; font-size: 15px; outline: none; -moz-appearance: textfield; }
.budget input::-webkit-outer-spin-button, .budget input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.budget .unit { color: var(--faint); font-size: 13px; }
.budget .clear { background: none; border: 0; color: var(--faint); padding: 4px 6px; font-size: 13px; }
.budget .clear[hidden] { display: none; }
.legend { display: flex; gap: 14px; font-size: 13px; color: var(--muted); padding: 0 18px; flex-wrap: wrap; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; }
.legend[hidden] { display: none; }
.chart-wrap { position: relative; padding: 8px 10px 10px 4px; touch-action: pan-y; }
#chart { display: block; width: 100%; overflow: visible; }
#chart text { font-family: inherit; font-size: 12px; fill: var(--faint); }
#chart .grid line { stroke: var(--c-grid); }
#chart .hl-text { font-size: 12px; font-weight: 600; fill: var(--c-ink); }
.tip {
  position: absolute; pointer-events: none; z-index: 2;
  background: var(--tip-bg); border: 1px solid var(--rule-strong); border-radius: 6px;
  padding: 8px 11px; font-size: 13px; white-space: nowrap; display: none;
  box-shadow: 0 12px 28px rgba(15,31,51,0.18);
}
.tip .t { color: var(--muted); }
.tip .v { font-weight: 600; font-size: 15px; margin-top: 2px; color: var(--strong); }
.empty { padding: 60px 20px; text-align: center; color: var(--faint); }

/* Table */
.table-head { padding: 12px 18px 10px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; }
.table-head h2 { margin: 0; font-size: 14px; font-weight: 500; color: var(--muted); letter-spacing: 0.02em; }
.table-scroll { overflow: auto; max-height: 460px; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th {
  position: sticky; top: 0; z-index: 1; background: var(--card-2);
  text-align: left; font-weight: 500; font-size: 13px; color: var(--faint);
  padding: 9px 12px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap;
}

footer { color: var(--faint); font-size: 13px; padding-top: 4px; }

@media (max-width: 900px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 640px) {
  body { font-size: 14px; }

}

/* Grid mix */
.seg.prices button[data-view="mix"][aria-pressed="true"] { color: var(--gas-t); border-color: var(--gas); background: rgba(240,138,36,0.12); }

.tip .row .m { color: var(--faint); min-width: 70px; text-align: right; }

@media (max-width: 900px) { .mixkey { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

<script>
(() => {
  "use strict";

  const API = "https://data.elexon.co.uk/bmrs/api/v1/";
  const TZ = "Europe/London";
  const MAX_CUSTOM_DAYS = 93;
  let SSP_COLOR = "#3B82F6";
  // chart colours from the KeelAI tokens in the stylesheet (light or dark), refreshed on every draw
  const C = {};
  const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  function readColours() {
    SSP_COLOR = cssVar("--ssp") || SSP_COLOR;
    ["ink", "halo", "hollow", "zero", "midnight", "hour", "guide", "hl", "above-bar", "below-bar", "above-fill", "below-fill", "gas-edge", "hatch-bg", "hatch", "prov"]
      .forEach((k) => { C[k] = cssVar("--c-" + k); });
  }

  // Fuel groups, bottom of the stack first so gas sits on the axis
  const GROUPS = [
    { id: "gas", name: "Gas", color: "#f08a24", fuels: ["CCGT", "OCGT"] },
    { id: "other", name: "Coal, oil, other", color: "#b8573a", fuels: ["COAL", "OIL", "OTHER"] },
    { id: "biomass", name: "Biomass", color: "#6fbe44", fuels: ["BIOMASS"] },
    { id: "nuclear", name: "Nuclear", color: "#9f7ae0", fuels: ["NUCLEAR"] },
    { id: "hydro", name: "Hydro", color: "#00a9a9", fuels: ["NPSHYD"] },
    { id: "storage", name: "Pumped storage", color: "#c77fb5", fuels: ["PS"] },
    { id: "imports", name: "Imports", color: "#8A9099", fuels: [] },
    { id: "wind", name: "Wind", color: "#2498d1", fuels: ["WIND"] },
    { id: "solar", name: "Solar", color: "#ffd23f", fuels: [] }
  ];
  function groupOf(fuel) {
    if (fuel.startsWith("INT")) return "imports";
    for (const g of GROUPS) if (g.fuels.includes(fuel)) return g.id;
    return "other";
  }

  const state = {
    view: "ssp",
    range: "today",
    from: null, to: null,
    cache: { ssp: { key: null, rows: [] }, mix: { key: null, rows: [] } },
    loading: false,
    wsFailed: false,
    budget: null,
    units: "share",
    tableMode: "daily", // daily averages by default whenever the range covers more than one day
    highlight: null,
    loadId: 0
  };
  const $ = (id) => document.getElementById(id);
  const rows = () => state.cache[state.view].rows;

  // Dates and times, all UK local
  const ymdFmt = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
  const hmFmt = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
  const hmsFmt = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });
  const partsFmt = new Intl.DateTimeFormat("en-GB", { timeZone: TZ, weekday: "short", day: "numeric", month: "numeric", year: "numeric" });
  const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  const todayUK = () => ymdFmt.format(new Date());
  function addDays(ymd, n) {
    const [y, m, d] = ymd.split("-").map(Number);
    return new Date(Date.UTC(y, m - 1, d + n, 12)).toISOString().slice(0, 10);
  }
  function daysBetween(a, b) {
    const pa = a.split("-").map(Number), pb = b.split("-").map(Number);
    return Math.round((Date.UTC(pb[0], pb[1] - 1, pb[2]) - Date.UTC(pa[0], pa[1] - 1, pa[2])) / 86400000);
  }
  function ordinal(n) { const s = ["th", "st", "nd", "rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
  function parts(ms) { const o = {}; for (const p of partsFmt.formatToParts(new Date(ms))) o[p.type] = p.value; return o; }
  function longDate(ms) { const p = parts(ms); return `${p.weekday} ${ordinal(+p.day)} ${MONTHS[+p.month - 1]} ${p.year}`; }
  function dayOnly(ms) { const p = parts(ms); return `${p.weekday} ${+p.day}`; }
  function shortDate(ms) { const p = parts(ms); return `${p.weekday} ${ordinal(+p.day)} ${MONTHS[+p.month - 1]}`; }
  function ymdLong(ymd) { const [y, m, d] = ymd.split("-").map(Number); return longDate(Date.UTC(y, m - 1, d, 12)); }
  const hm = (ms) => hmFmt.format(new Date(ms));
  // Full date on wide screens, shorter on phones
  const dual = (a, b) => `<span class="long">${a}</span><span class="short">${b}</span>`;

  // Fallback if a record has no startTime: UK midnight plus 30 minutes per period
  function periodStart(dateStr, period) {
    const [y, m, d] = dateStr.split("-").map(Number);
    const noon = Date.UTC(y, m - 1, d, 12);
    const ukHour = +new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", hourCycle: "h23" }).format(new Date(noon));
    return Date.UTC(y, m - 1, d, 0) - (ukHour - 12) * 3600000 + (period - 1) * 1800000;
  }
  const startOf = (r) => (r.startTime ? Date.parse(r.startTime) : periodStart(r.settlementDate, r.settlementPeriod));

  // Formatting
  const money = (v) => (v < 0 ? "-£" : "£") + Math.abs(v).toFixed(2);
  const signedMoney = (v) => (v > 0 ? "+" : v < 0 ? "-" : "") + "£" + Math.abs(v).toFixed(2);
  const pct = (v) => v.toFixed(1) + "%";
  const mw = (v) => Math.round(v).toLocaleString("en-GB");
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const numOrNull = (v) => (v === null || v === undefined || v === "" || isNaN(v) ? null : Number(v));

  // Data
  function datesForRange() {
    const today = todayUK();
    if (state.range === "today") return [today];
    const out = [];
    if (state.range === "custom") { for (let d = state.from; d <= state.to; d = addDays(d, 1)) out.push(d); return out; }
    if (state.range === "mtd") { for (let d = today.slice(0, 8) + "01"; d <= today; d = addDays(d, 1)) out.push(d); return out; }
    for (let i = Number(state.range); i >= 0; i--) out.push(addDays(today, -i));
    return out;
  }
  const rangeKey = () => [state.range, state.from, state.to, todayUK()].join("|");

  async function getJson(url, date) {
    const res = await fetch(url);
    if (res.status === 404) return [];
    if (!res.ok) throw new Error(`Elexon returned an error for ${ymdLong(date)} (HTTP ${res.status}). Press Refresh to try again.`);
    const json = await res.json();
    return Array.isArray(json) ? json : Array.isArray(json.data) ? json.data : [];
  }
  async function fetchDay(view, date) {
    if (view === "ssp") return getJson(`${API}balancing/settlement/system-prices/${date}?format=json`, date);
    // Transmission-connected plant by fuel type (FUELHH), plus Elexon's actual or estimated
    // wind and solar (B1630), which adds the plant on local networks
    const from = new Date(periodStart(date, 1)).toISOString();
    const to = new Date(periodStart(addDays(date, 1), 1) - 60000).toISOString();
    const [fuel, ws] = await Promise.all([
      getJson(`${API}datasets/FUELHH?settlementDateFrom=${date}&settlementDateTo=${date}&format=json`, date),
      getJson(`${API}generation/actual/per-type/wind-and-solar?from=${encodeURIComponent(from)}&to=${encodeURIComponent(to)}&format=json`, date)
        .catch(() => { state.wsFailed = true; return []; })
    ]);
    const extra = ws.filter((r) => r.settlementDate === date && r.psrType).map((r) => ({
      settlementDate: r.settlementDate, settlementPeriod: r.settlementPeriod, startTime: r.startTime,
      publishTime: r.publishTime, fuelType: "B1630 " + r.psrType, generation: r.quantity
    }));
    return fuel.concat(extra);
  }
  async function fetchAll(view, dates) {
    const results = new Array(dates.length);
    let next = 0;
    async function worker() { while (next < dates.length) { const i = next++; results[i] = await fetchDay(view, dates[i]); } }
    await Promise.all(Array.from({ length: Math.min(6, dates.length) }, worker));
    return results.flat();
  }

  function normalisePrices(list) {
    const seen = new Map();
    for (const r of list) {
      seen.set(r.settlementDate + "-" + r.settlementPeriod, {
        t: startOf(r), date: r.settlementDate, period: r.settlementPeriod,
        v: numOrNull(r.systemSellPrice), niv: numOrNull(r.netImbalanceVolume), code: r.priceDerivationCode ?? ""
      });
    }
    return [...seen.values()].filter((d) => d.v !== null).sort((a, b) => a.t - b.t);
  }

  function normaliseMix(list) {
    // Keep the latest publication of each fuel type in each period
    const latest = new Map();
    for (const r of list) {
      const k = `${r.settlementDate}-${r.settlementPeriod}-${r.fuelType}`;
      const prev = latest.get(k);
      if (!prev || (r.publishTime || "") >= (prev.publishTime || "")) latest.set(k, r);
    }
    const periods = new Map();
    for (const r of latest.values()) {
      const k = r.settlementDate + "-" + r.settlementPeriod;
      let p = periods.get(k);
      if (!p) {
        p = { t: startOf(r), date: r.settlementDate, period: r.settlementPeriod, raw: {}, g: {}, exports: 0 };
        for (const g of GROUPS) p.g[g.id] = 0;
        periods.set(k, p);
      }
      const val = Number(r.generation) || 0;
      p.raw[r.fuelType] = val;
      if (r.fuelType.startsWith("B1630 ")) continue;
      if (val > 0) p.g[groupOf(r.fuelType)] += val;
      else if (r.fuelType.startsWith("INT")) p.exports -= val;
    }
    let out = [...periods.values()].sort((a, b) => a.t - b.t);
    for (const p of out) {
      const ws = Object.keys(p.raw).filter((k) => k.startsWith("B1630 "));
      p.full = ws.length > 0;
      if (p.full) {
        // B1630 wind already includes the transmission wind counted in FUELHH, so replace it
        p.g.wind = ws.filter((k) => /wind/i.test(k)).reduce((a, k) => a + Math.max(0, p.raw[k]), 0);
        p.g.solar = ws.filter((k) => /solar/i.test(k)).reduce((a, k) => a + Math.max(0, p.raw[k]), 0);
      }
      p.total = GROUPS.reduce((s, g) => s + p.g[g.id], 0);
      p.v = p.total ? (p.g.gas / p.total) * 100 : 0; // gas share, the headline figure
    }
    out = out.filter((p) => p.total > 0 && p.raw.CCGT !== undefined);
    // Elexon's wind and solar estimate runs about two hours behind the fuel data. For the
    // periods after the last full one, estimate wind and solar so gas stays current:
    // wind follows the metered transmission wind, scaled up to the last full period's total,
    // and solar follows the sun's height from the last full period's figure.
    let lastFull = null;
    for (let i = out.length - 1; i >= 0; i--) if (out[i].full) { lastFull = out[i]; break; }
    if (lastFull) {
      const windRatio = lastFull.raw.WIND > 0 ? lastFull.g.wind / lastFull.raw.WIND : 1;
      const sunRef = sunHeight(lastFull.t);
      for (const p of out) {
        if (p.t <= lastFull.t) continue;
        p.provisional = true;
        p.g.wind = p.raw.WIND > 0 ? p.raw.WIND * windRatio : lastFull.g.wind;
        const sun = sunHeight(p.t);
        p.g.solar = sun <= 0 ? 0 : sunRef > 0.05 ? lastFull.g.solar * Math.min(3, sun / sunRef) : lastFull.g.solar;
        p.total = GROUPS.reduce((a, g) => a + p.g[g.id], 0);
        p.v = p.total ? (p.g.gas / p.total) * 100 : 0;
      }
    }
    return out;
  }

  // Sine of the sun's elevation over central GB (53.5N, 1.5W), used to shape provisional solar
  function sunHeight(ms) {
    const d = new Date(ms);
    const start = Date.UTC(d.getUTCFullYear(), 0, 0);
    const n = (ms - start) / 86400000;
    const rad = Math.PI / 180;
    const decl = 23.44 * Math.sin(((2 * Math.PI) / 365) * (284 + n)) * rad;
    const b = ((2 * Math.PI) / 364) * (n - 81);
    const eot = 9.87 * Math.sin(2 * b) - 7.53 * Math.cos(b) - 1.5 * Math.sin(b);
    const hours = d.getUTCHours() + d.getUTCMinutes() / 60 + 0.25; // middle of the half hour
    const hourAngle = (hours + -1.5 / 15 + eot / 60 - 12) * 15 * rad;
    const lat = 53.5 * rad;
    return Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(hourAngle);
  }

  async function load(force) {
    const view = state.view, key = rangeKey();
    if (!force && state.cache[view].key === key) { render(); return; }
    if (view === "mix") state.wsFailed = false;
    const id = ++state.loadId;
    state.loading = true;
    setBusy(true);
    $("error").hidden = true;
    render();
    try {
      const list = await fetchAll(view, datesForRange());
      if (id !== state.loadId) return;
      state.cache[view] = { key, rows: view === "ssp" ? normalisePrices(list) : normaliseMix(list) };
      state.highlight = null;
      $("updated").innerHTML = `<span class="word">Updated </span>${hmsFmt.format(new Date())}`;
      $("liveDot").classList.remove("stale");
    } catch (e) {
      if (id !== state.loadId) return;
      $("error").textContent = e instanceof TypeError ? "Couldn't reach Elexon. Check your connection and press Refresh." : e.message;
      $("error").hidden = false;
      $("liveDot").classList.add("stale");
    } finally {
      if (id === state.loadId) { state.loading = false; setBusy(false); render(); }
    }
  }
  function setBusy(b) { $("refreshBtn").disabled = b; $("refreshBtn").classList.toggle("spin", b); }

  function summary(s) {
    if (!s.length) return null;
    let sum = 0, min = s[0], max = s[0];
    for (const d of s) { sum += d.v; if (d.v < min.v) min = d; if (d.v > max.v) max = d; }
    const latest = s[s.length - 1], prev = s.length > 1 ? s[s.length - 2] : null;
    return { avg: sum / s.length, min, max, latest, change: prev ? latest.v - prev.v : null };
  }
  function rangeLabel() {
    if (state.range === "today") return "today";
    if (state.range === "7") return "last 7 days";
    if (state.range === "30") return "last 30 days";
    if (state.range === "mtd") return "month to date";
    return state.from === state.to ? ymdLong(state.from) : `${ymdLong(state.from)} to ${ymdLong(state.to)}`;
  }

  // Render
  function render() {
    const s = rows(), sum = summary(s), mix = state.view === "mix";
    const heading = mix ? "GB grid mix" : "GB system sell price";
    $("viewTitle").textContent = heading;
    document.title = `${heading} · KeelAI`;
    const perDay = showDaily(s) ? ", daily average" : "";
    $("chartTitle").textContent = mix ? `Generation by fuel type, ${rangeLabel()}${perDay}` : `System sell price, ${rangeLabel()}${perDay}`;
    const provCount = mix ? s.filter((d) => d.provisional).length : 0;
    $("tableTitle").textContent = `Settlement data, ${s.length} period${s.length === 1 ? "" : "s"}${provCount ? `. Figures in italics are provisional estimates` : ""}`;
    $("budgetBox").hidden = mix;
    $("unitsBox").hidden = !mix;
    renderStats(s, sum);
    renderNow(s);
    renderLegend(s);
    drawChart();
    renderTable(s);
    $("footer").innerHTML = mix
      ? `${state.wsFailed ? "<strong>Elexon's wind and solar estimate didn't load, so solar and local wind are missing from some periods. Press Refresh to try again.</strong><br>" : ""}Generation from <a href="https://bmrs.elexon.co.uk/generation-by-fuel-type" target="_blank" rel="noopener">Elexon BMRS</a>, averaged over each half hour. Gas, nuclear, biomass, hydro, storage, imports and other fuels are metered transmission-connected output. Wind and solar come from Elexon's <a href="https://bmrs.elexon.co.uk/actual-or-estimated-wind-and-solar-power-generation" target="_blank" rel="noopener">actual or estimated wind and solar</a> data, which adds modelled output from plant on local networks. That estimate runs about two hours behind, so the latest periods use a provisional wind and solar figure, marked on the page, until Elexon publishes. Small gas, CHP and battery sites on local networks aren't included. Times are UK local and show the start of each settlement period.`
      : `Data from the <a href="https://bmrs.elexon.co.uk/system-prices" target="_blank" rel="noopener">Elexon BMRS</a> system prices feed. Times are UK local and show the start of each settlement period.`;
  }

  function renderStats(s, sum) {
    const el = $("stats");
    if (!sum) { el.innerHTML = ""; return; }
    const mix = state.view === "mix";
    const fmt = mix ? pct : money;
    const when = (d) => dual(`${longDate(d.t)}, ${hm(d.t)}`, `${shortDate(d.t)}, ${hm(d.t)}`);
    const hlCard = (k, text) => `<div class="stat pick" role="button" tabindex="0" data-hl="${k}" aria-pressed="${state.highlight === k}" title="Show on the chart"><div class="label">${text} <span class="caret" aria-hidden="true">▶</span></div>`;
    let avgExtra = "";
    if (mix) {
      avgExtra = `<div class="sub">${mw(s.reduce((a, d) => a + d.g.gas, 0) / s.length)} MW on average</div>`;
    } else if (state.budget !== null) {
      const diff = sum.avg - state.budget, above = s.filter((d) => d.v >= state.budget).length;
      avgExtra = `<div class="delta ${diff >= 0 ? "over" : "under"}">${signedMoney(diff)} vs budget</div><div class="sub">${above} of ${s.length} periods at or above</div>`;
    }
    const ch = sum.change;
    const chHtml = ch === null ? "" : mix
      ? `<div class="delta" style="color:var(--muted)">${ch >= 0 ? "▲" : "▼"} ${Math.abs(ch).toFixed(1)} pts on previous period</div>`
      : `<div class="delta ${ch >= 0 ? "up" : "down"}">${ch >= 0 ? "▲" : "▼"} £${Math.abs(ch).toFixed(2)} on previous period</div>`;
    const mwLine = (d) => (mix ? `<div class="sub">${mw(d.g.gas)} MW${d.provisional ? ", share provisional" : ""}</div>` : "");
    let minD = sum.min, maxD = sum.max, minLabel = mix ? "Least gas" : "Min", maxLabel = mix ? "Most gas" : "Max";
    let whenMM = when, mwMM = mwLine;
    if (showDaily(s)) {
      // With daily averages on, min and max are the lowest and highest days
      const ds = summary(dailyRows(s));
      minD = ds.min; maxD = ds.max;
      minLabel = mix ? "Least gas day" : "Lowest day"; maxLabel = mix ? "Most gas day" : "Highest day";
      const today = todayUK();
      whenMM = (d) => dual(longDate(d.t), shortDate(d.t)) + (d.date === today ? `, to ${hm(d.last.t)}` : "");
      mwMM = (d) => (mix ? `<div class="sub">${mw(d.g.gas)} MW on average</div>` : `<div class="sub">${d.n} periods</div>`);
    }
    el.innerHTML = `
      <div class="stat"><div class="label">${mix ? "Average gas share" : "Average"}</div><div class="value">${fmt(sum.avg)}</div>${avgExtra}</div>
      ${hlCard("min", minLabel)}<div class="value">${fmt(minD.v)}</div><div class="sub">${whenMM(minD)}</div>${mwMM(minD)}</div>
      ${hlCard("max", maxLabel)}<div class="value">${fmt(maxD.v)}</div><div class="sub">${whenMM(maxD)}</div>${mwMM(maxD)}</div>
      <div class="stat"><div class="label">${mix ? "Gas now" : "Latest"}</div><div class="value">${fmt(sum.latest.v)}</div><div class="sub">${when(sum.latest)}</div>${mwLine(sum.latest)}${chHtml}</div>`;
  }

  function renderNow(s) {
    const el = $("nowPanel");
    if (state.view !== "mix" || !s.length) { el.hidden = true; return; }
    const d = s[s.length - 1];
    const groups = [...GROUPS].sort((a, b) => (a.id === "gas" ? -1 : b.id === "gas" ? 1 : d.g[b.id] - d.g[a.id]));
    const bar = groups.filter((g) => d.g[g.id] > 0)
      .map((g) => `<span style="width:${(d.g[g.id] / d.total) * 100}%;background:${g.color}" title="${g.name} ${pct((d.g[g.id] / d.total) * 100)}"></span>`).join("");
    const key = groups.map((g) => `<div class="${g.id === "gas" ? "gas" : ""}"><i style="background:${g.color}"></i><span class="n">${g.name}</span><span class="p">${pct((d.g[g.id] / d.total) * 100)}</span><span class="mw">${mw(d.g[g.id])} MW</span></div>`).join("");
    const note = d.provisional
      ? `<p class="prov-note">Provisional. Wind and solar are estimated until Elexon publishes its figures for this period, usually about two hours behind. Gas and the other fuels are metered.</p>` : "";
    el.innerHTML = `<div class="now-head"><h2>Latest mix, ${hm(d.t)} ${shortDate(d.t)}${d.provisional ? ' <span class="prov-tag">Provisional</span>' : ""}</h2><span class="total">${mw(d.total)} MW generating${d.exports > 0 ? `, ${mw(d.exports)} MW exporting` : ""}</span></div>
      <div class="mixbar" role="img" aria-label="Latest generation mix">${bar}</div><div class="mixkey">${key}</div>${note}`;
    el.hidden = false;
  }

  function renderLegend(s) {
    const el = $("legend");
    el.classList.remove("mixlegend");
    if (!s.length) { el.hidden = true; return; }
    if (state.view === "mix") {
      el.innerHTML = [...GROUPS].reverse().map((g) => `<span><i style="background:${g.color}"></i>${g.name}</span>`).join("");
      el.classList.add("mixlegend");
      el.hidden = false;
    } else if (state.budget !== null) {
      el.innerHTML = `<span><i style="background: rgba(124,194,66,0.6)"></i>Above budget</span><span><i style="background: rgba(245,214,61,0.6)"></i>Below budget</span>`;
      el.hidden = false;
    } else el.hidden = true;
  }

  // One row per settlement date. Prices are the plain mean of the periods; gas share is
  // weighted by output (gas MWh over total MWh), and fuel columns are average MW.
  function dailyRows(s) {
    const days = new Map();
    for (const d of s) {
      let g = days.get(d.date);
      if (!g) { g = { date: d.date, t: d.t, list: [] }; days.set(d.date, g); }
      g.list.push(d);
    }
    return [...days.values()].map((g) => {
      const n = g.list.length;
      const out = { date: g.date, t: g.t, n, last: g.list[n - 1] };
      if (state.view === "ssp") {
        let sum = 0, min = g.list[0], max = g.list[0];
        for (const d of g.list) { sum += d.v; if (d.v < min.v) min = d; if (d.v > max.v) max = d; }
        Object.assign(out, { avg: sum / n, v: sum / n, min, max,
          niv: g.list.reduce((a, d) => a + (d.niv ?? 0), 0),
          above: state.budget === null ? null : g.list.filter((d) => d.v >= state.budget).length });
      } else {
        out.g = {};
        for (const grp of GROUPS) out.g[grp.id] = g.list.reduce((a, d) => a + d.g[grp.id], 0) / n;
        out.total = g.list.reduce((a, d) => a + d.total, 0) / n;
        out.share = out.total ? (out.g.gas / out.total) * 100 : 0;
        out.v = out.share;
        out.provisional = g.list.some((d) => d.provisional);
      }
      return out;
    });
  }
  const multiDay = (s) => s.length > 0 && s[0].date !== s[s.length - 1].date;
  const showDaily = (s) => state.tableMode === "daily" && multiDay(s);

  function renderDaily(s) {
    const mix = state.view === "mix";
    const days = dailyRows(s).reverse();
    const today = todayUK();
    const cols = mix
      ? ["Date", "Periods", "Gas share", "Gas (MW)", "Wind (MW)", "Solar (MW)", "Nuclear (MW)", "Biomass (MW)", "Imports (MW)", "Hydro (MW)", "Pumped storage (MW)", "Coal, oil, other (MW)", "Total (MW)"]
      : ["Date", "Periods", "Average SSP (£/MWh)", "Min", "Max", "Net imbalance vol (MWh)", ...(state.budget !== null ? ["At or above budget"] : [])];
    $("thead").innerHTML = `<tr>${cols.map((c) => `<th>${c}</th>`).join("")}</tr>`;
    let html = "";
    for (const d of days) {
      const soFar = d.date === today ? ` <span class="so-far">to ${hm(d.last.t)}</span>` : "";
      const lead = `<tr><td class="date">${dual(longDate(d.t), shortDate(d.t))}${soFar}</td><td>${d.n}</td>`;
      if (mix) {
        const est = d.provisional ? ' class="est" title="Includes provisional estimates"' : "";
        html += lead + `<td class="sel-gas${d.provisional ? " est" : ""}">${pct(d.share)}</td><td>${mw(d.g.gas)}</td><td${est}>${mw(d.g.wind)}</td><td${est}>${mw(d.g.solar)}</td><td>${mw(d.g.nuclear)}</td><td>${mw(d.g.biomass)}</td><td>${mw(d.g.imports)}</td><td>${mw(d.g.hydro)}</td><td>${mw(d.g.storage)}</td><td>${mw(d.g.other)}</td><td class="time">${mw(d.total)}</td></tr>`;
      } else {
        const b = d.above === null ? "" : `<td class="${d.above * 2 >= d.n ? "over" : "under"}">${d.above} of ${d.n}</td>`;
        html += lead + `<td class="sel-ssp">${money(d.avg)}</td><td>${money(d.min.v)} <span class="at">at ${hm(d.min.t)}</span></td><td>${money(d.max.v)} <span class="at">at ${hm(d.max.t)}</span></td><td class="${d.niv >= 0 ? "up" : "down"}">${mw(d.niv)}</td>${b}</tr>`;
      }
    }
    $("rows").innerHTML = html;
    const provDays = mix ? days.filter((d) => d.provisional).length : 0;
    $("tableTitle").textContent = `Daily averages, ${days.length} days${provDays ? ". Figures in italics include provisional estimates" : ""}`;
  }

  function renderTable(s) {
    document.querySelectorAll(".gran").forEach((g) => { g.hidden = !multiDay(s); });
    if (showDaily(s)) return renderDaily(s);
    const mix = state.view === "mix";
    const cols = mix
      ? ["Date", "Time", "Period", "Gas share", "Gas (MW)", "Wind (MW)", "Solar (MW)", "Nuclear (MW)", "Biomass (MW)", "Imports (MW)", "Hydro (MW)", "Pumped storage (MW)", "Coal, oil, other (MW)", "Total (MW)"]
      : ["Date", "Time", "Period", "SSP (£/MWh)", "Net imbalance vol (MWh)", "Price derivation code"];
    $("thead").innerHTML = `<tr>${cols.map((c) => `<th>${c}</th>`).join("")}</tr>`;
    let prevDate = null, html = "";
    for (const d of [...s].reverse()) {
      const startDay = prevDate !== null && d.date !== prevDate;
      prevDate = d.date;
      const lead = `<tr${startDay ? ' class="day-start"' : ""}><td class="date">${dual(longDate(d.t), shortDate(d.t))}</td><td class="time">${hm(d.t)}</td><td>${d.period}</td>`;
      if (mix) {
        const est = d.provisional ? ' class="est" title="Provisional estimate"' : "";
        html += lead + `<td class="sel-gas${d.provisional ? " est" : ""}">${pct(d.v)}</td><td>${mw(d.g.gas)}</td><td${est}>${mw(d.g.wind)}</td><td${est}>${d.full || d.provisional ? mw(d.g.solar) : "-"}</td><td>${mw(d.g.nuclear)}</td><td>${mw(d.g.biomass)}</td><td>${mw(d.g.imports)}</td><td>${mw(d.g.hydro)}</td><td>${mw(d.g.storage)}</td><td>${mw(d.g.other)}</td><td class="time">${mw(d.total)}</td></tr>`;
      } else {
        html += lead + `<td class="sel-ssp">${money(d.v)}</td><td class="${d.niv === null ? "" : d.niv >= 0 ? "up" : "down"}">${d.niv === null ? "-" : Math.round(d.niv)}</td><td class="code">${esc(d.code || "-")}</td></tr>`;
      }
    }
    $("rows").innerHTML = html || `<tr><td colspan="${cols.length}" class="empty">${state.loading ? "Loading" : "Nothing published for this range yet."}</td></tr>`;
  }

  // Chart
  const NS = "http://www.w3.org/2000/svg";
  let geom = null;
  function el(name, attrs, parent) {
    const e = document.createElementNS(NS, name);
    for (const a in attrs) e.setAttribute(a, attrs[a]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function niceStep(span, target) {
    const raw = span / Math.max(1, target), mag = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / mag;
    return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * mag;
  }
  function monotonePath(pts) {
    const n = pts.length;
    if (!n) return "";
    if (n === 1) return `M${pts[0][0]},${pts[0][1]}`;
    const t = new Array(n), sign = (v) => (v < 0 ? -1 : 1);
    for (let i = 1; i < n - 1; i++) {
      const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
      const h0 = x1 - x0, h1 = x2 - x1, s0 = (y1 - y0) / (h0 || 1), s1 = (y2 - y1) / (h1 || 1);
      const p = (s0 * h1 + s1 * h0) / ((h0 + h1) || 1);
      t[i] = (sign(s0) + sign(s1)) * Math.min(Math.abs(s0), Math.abs(s1), 0.5 * Math.abs(p)) || 0;
    }
    const end = (i0, i1, tt) => { const h = pts[i1][0] - pts[i0][0]; return h ? (3 * (pts[i1][1] - pts[i0][1]) / h - tt) / 2 : tt; };
    t[0] = n > 2 ? end(0, 1, t[1]) : (pts[1][1] - pts[0][1]) / ((pts[1][0] - pts[0][0]) || 1);
    t[n - 1] = n > 2 ? end(n - 2, n - 1, t[n - 2]) : t[0];
    let d = `M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;
    for (let i = 0; i < n - 1; i++) {
      const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], dx = (x1 - x0) / 3;
      d += `C${(x0 + dx).toFixed(1)},${(y0 + dx * t[i]).toFixed(1)} ${(x1 - dx).toFixed(1)},${(y1 - dx * t[i + 1]).toFixed(1)} ${x1.toFixed(1)},${y1.toFixed(1)}`;
    }
    return d;
  }
  function xTicks(s, width) {
    if (s.length < 2) return s.map((d) => ({ t: d.t, label: hm(d.t) }));
    const spanH = (s[s.length - 1].t - s[0].t) / 3600000, maxTicks = Math.max(2, Math.floor(width / 62));
    let mode = null, step = null;
    for (const h of [1, 2, 3, 4, 6, 12]) if (spanH / h <= maxTicks) { mode = "h"; step = h; break; }
    if (!mode) for (const dd of [1, 2, 3, 5, 7, 14]) if (spanH / 24 / dd <= maxTicks) { mode = "d"; step = dd; break; }
    if (!mode) { mode = "d"; step = 30; }
    const out = [];
    let dayCount = 0;
    for (const d of s) {
      const [H, M] = hm(d.t).split(":").map(Number);
      if (M !== 0) continue;
      if (mode === "h") { if (H % step === 0) out.push({ t: d.t, label: H === 0 && spanH > 24 ? shortDate(d.t) : hm(d.t), midnight: H === 0 }); }
      else if (H === 0) { if (dayCount % step === 0) out.push({ t: d.t, label: shortDate(d.t), midnight: true }); dayCount++; }
    }
    return out;
  }

  // Frame: gridlines, both axes; returns scale functions
  function frame(svg, s, W, H, lo, hi, step, yLabel) {
    const m = { l: 54, r: 14, t: 16, b: 28 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const t0 = s[0].t, t1 = s.length > 1 ? s[s.length - 1].t : s[0].t + 1800000;
    const x = (t) => m.l + ((t - t0) / (t1 - t0)) * iw;
    const y = (v) => m.t + ih - ((v - lo) / (hi - lo)) * ih;
    const g = el("g", { class: "grid" }, svg);
    for (let v = lo; v <= hi + step / 2; v += step) {
      el("line", { x1: m.l, x2: m.l + iw, y1: y(v), y2: y(v) }, g);
      el("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = yLabel(v);
    }
    let lastRight = -Infinity;
    for (const tk of xTicks(s, iw)) {
      const xx = x(tk.t);
      el("line", { x1: xx, x2: xx, y1: m.t, y2: m.t + ih, stroke: tk.midnight ? C.midnight : C.hour }, svg);
      const w = tk.label.length * 6.8;
      const anchor = xx - w / 2 < m.l - 6 ? "start" : xx + w / 2 > m.l + iw + 6 ? "end" : "middle";
      const left = anchor === "start" ? xx : anchor === "end" ? xx - w : xx - w / 2;
      if (left < lastRight + 12) continue;
      el("text", { x: xx, y: H - 8, "text-anchor": anchor }, svg).textContent = tk.label;
      lastRight = left + w;
    }
    return { m, iw, ih, x, y };
  }

  function drawChart() {
    const svg = $("chart"), wrap = $("chartWrap");
    readColours();
    svg.innerHTML = "";
    $("tip").style.display = "none";
    const s = rows();
    const W = Math.max(280, wrap.clientWidth - 14), H = W < 520 ? 230 : 280;
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("height", H);
    geom = null;
    if (!s.length) {
      el("text", { x: W / 2, y: H / 2, "text-anchor": "middle" }, svg).textContent = state.loading ? "Loading" : "Nothing published for this range yet";
      return;
    }
    if (showDaily(s)) {
      const days = dailyRows(s);
      if (state.view === "mix") drawDailyMix(svg, days, W, H); else drawDailyPrice(svg, days, W, H);
    } else if (state.view === "mix") drawMix(svg, s, W, H); else drawPrice(svg, s, W, H);
  }

  // Daily charts: one column per day
  function bandFrame(svg, days, W, H, lo, hi, step, yLabel) {
    const m = { l: 54, r: 14, t: 16, b: 28 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    const slot = iw / days.length, bw = Math.max(2, Math.min(56, slot * 0.72));
    const xc = (i) => m.l + slot * (i + 0.5);
    const y = (v) => m.t + ih - ((v - lo) / (hi - lo)) * ih;
    const g = el("g", { class: "grid" }, svg);
    for (let v = lo; v <= hi + step / 2; v += step) {
      el("line", { x1: m.l, x2: m.l + iw, y1: y(v), y2: y(v) }, g);
      el("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end" }, svg).textContent = yLabel(v);
    }
    // Label every day if there's room, otherwise every second, third or seventh
    const labelW = (days.length > 10 ? 52 : 84);
    const every = [1, 2, 3, 7, 14].find((k) => (slot * k) >= labelW) || 14;
    days.forEach((d, i) => {
      if (i % every) return;
      const txt = days.length > 10 ? dayOnly(d.t) : shortDate(d.t);
      el("text", { x: xc(i), y: H - 8, "text-anchor": "middle" }, svg).textContent = txt;
    });
    return { m, iw, ih, xc, bw, y, x: null };
  }

  function drawDailyPrice(svg, days, W, H) {
    let lo = Math.min(...days.map((d) => d.v)), hi = Math.max(...days.map((d) => d.v));
    if (state.budget !== null) { lo = Math.min(lo, state.budget); hi = Math.max(hi, state.budget); }
    const pad = Math.max((hi - lo) * 0.15, 2);
    lo -= pad; hi += pad;
    const step = niceStep(hi - lo, H < 250 ? 4 : 5);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const f = bandFrame(svg, days, W, H, lo, hi, step, (v) => (v < 0 ? "-£" : "£") + Math.abs(+v.toFixed(2)));
    const { xc, bw, y } = f, today = todayUK();
    const pts = days.map((d, i) => [xc(i), y(d.v)]);
    if (state.budget !== null) {
      // Bars grow from the budget line: green for days above it, yellow for days below
      const by = y(state.budget);
      days.forEach((d, i) => {
        const top = y(d.v);
        el("rect", { x: xc(i) - bw / 2, y: Math.min(top, by), width: bw, height: Math.max(1, Math.abs(by - top)), rx: 2,
          fill: d.v >= state.budget ? C["above-bar"] : C["below-bar"], "fill-opacity": d.date === today ? 0.55 : 0.9 }, svg);
      });
      el("line", { x1: f.m.l, x2: f.m.l + f.iw, y1: by, y2: by, stroke: C.ink, "stroke-width": 1.5, "stroke-dasharray": "6 5", opacity: 0.85 }, svg);
      el("text", { x: f.m.l + f.iw, y: by - 6, "text-anchor": "end", class: "hl-text", "paint-order": "stroke", stroke: C.halo, "stroke-width": 4 }, svg).textContent = `Budget ${money(state.budget)}`;
    } else {
      let d = "";
      pts.forEach(([px, py], i) => { d += `${i ? "L" : "M"}${px.toFixed(1)},${py.toFixed(1)}`; });
      el("path", { d, fill: "none", stroke: SSP_COLOR, "stroke-width": 2, "stroke-linejoin": "round" }, svg);
      pts.forEach(([px, py], i) => el("circle", { cx: px, cy: py, r: 4, fill: days[i].date === today ? C.hollow : SSP_COLOR, stroke: SSP_COLOR, "stroke-width": 2 }, svg));
    }
    drawHighlight(svg, days, f, pts, SSP_COLOR, (d) => `${state.highlight === "max" ? "Highest" : "Lowest"} ${money(d.v)}, ${shortDate(d.t)}`);
    finishHover(svg, days, f, pts, W, SSP_COLOR);
  }

  function drawDailyMix(svg, days, W, H) {
    const share = state.units === "share";
    let hi = 100, step = 25;
    if (!share) {
      hi = Math.max(...days.map((d) => d.total));
      step = niceStep(hi, H < 250 ? 4 : 5);
      hi = Math.ceil(hi / step) * step;
    }
    const f = bandFrame(svg, days, W, H, 0, hi, step, (v) => (share ? v + "%" : v >= 1000 ? +(v / 1000).toFixed(1) + " GW" : v + " MW"));
    const { xc, bw, y } = f, today = todayUK();
    const pts = [];
    days.forEach((d, i) => {
      let base = 0;
      for (const g of GROUPS) {
        const v = share ? (d.g[g.id] / d.total) * 100 : d.g[g.id];
        if (v > 0) el("rect", { x: xc(i) - bw / 2, y: y(base + v), width: bw, height: Math.max(0, y(base) - y(base + v)), fill: g.color, "fill-opacity": d.date === today ? 0.6 : g.id === "gas" ? 0.95 : 0.8 }, svg);
        base += v;
        if (g.id === "gas") pts.push([xc(i), y(base)]);
      }
    });
    drawHighlight(svg, days, f, pts, "#f08a24", (d) => `${state.highlight === "max" ? "Most gas" : "Least gas"} ${pct(d.v)}, ${shortDate(d.t)}`);
    finishHover(svg, days, f, pts, W, "#f08a24");
  }

  function drawPrice(svg, s, W, H) {
    let lo = Infinity, hi = -Infinity;
    for (const d of s) { lo = Math.min(lo, d.v); hi = Math.max(hi, d.v); }
    if (state.budget !== null) { lo = Math.min(lo, state.budget); hi = Math.max(hi, state.budget); }
    if (lo === hi) { lo -= 10; hi += 10; }
    const step = niceStep(hi - lo, H < 250 ? 4 : 5);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const f = frame(svg, s, W, H, lo, hi, step, (v) => (v < 0 ? "-£" : "£") + Math.abs(+v.toFixed(2)));
    const { m, iw, ih, x, y } = f;
    if (lo < 0 && hi > 0) el("line", { x1: m.l, x2: m.l + iw, y1: y(0), y2: y(0), stroke: C.zero }, svg);
    const pts = s.map((d) => [x(d.t), y(d.v)]);
    const path = monotonePath(pts);
    if (state.budget !== null && pts.length > 1) {
      // Green where the price is above budget, yellow where below
      const by = y(state.budget), defs = el("defs", {}, svg);
      el("rect", { x: m.l, y: m.t - 20, width: iw, height: Math.max(0, by - m.t + 20) }, el("clipPath", { id: "clipAbove" }, defs));
      el("rect", { x: m.l, y: by, width: iw, height: Math.max(0, m.t + ih - by + 20) }, el("clipPath", { id: "clipBelow" }, defs));
      const area = `${path}L${pts[pts.length - 1][0].toFixed(1)},${by.toFixed(1)}L${pts[0][0].toFixed(1)},${by.toFixed(1)}Z`;
      el("path", { d: area, fill: C["above-fill"], "clip-path": "url(#clipAbove)" }, svg);
      el("path", { d: area, fill: C["below-fill"], "clip-path": "url(#clipBelow)" }, svg);
    }
    el("path", { d: path, fill: "none", stroke: SSP_COLOR, "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }, svg);
    if (pts.length === 1) el("circle", { cx: pts[0][0], cy: pts[0][1], r: 3, fill: SSP_COLOR }, svg);
    if (state.budget !== null) {
      const by = y(state.budget);
      el("line", { x1: m.l, x2: m.l + iw, y1: by, y2: by, stroke: C.ink, "stroke-width": 1.5, "stroke-dasharray": "6 5", opacity: 0.85 }, svg);
      el("text", { x: m.l + iw, y: by - 6, "text-anchor": "end", class: "hl-text", "paint-order": "stroke", stroke: C.halo, "stroke-width": 4 }, svg).textContent = `Budget ${money(state.budget)}`;
    }
    drawHighlight(svg, s, f, pts, SSP_COLOR, (d) => `${state.highlight === "max" ? "Max" : "Min"} ${money(d.v)} at ${hm(d.t)}`);
    finishHover(svg, s, f, pts, W, SSP_COLOR);
  }

  function drawMix(svg, s, W, H) {
    const share = state.units === "share";
    let hi = 100, step = 25;
    if (!share) {
      hi = Math.max(...s.map((d) => d.total));
      step = niceStep(hi, H < 250 ? 4 : 5);
      hi = Math.ceil(hi / step) * step;
    }
    const f = frame(svg, s, W, H, 0, hi, step, (v) => (share ? v + "%" : v >= 1000 ? +(v / 1000).toFixed(1) + " GW" : v + " MW"));
    const { x, y } = f;
    const val = (d, id) => (share ? (d.g[id] / d.total) * 100 : d.g[id]);
    const base = s.map(() => 0);
    let gasTop = null, windBase = null;
    for (const g of GROUPS) {
      const top = s.map((d, i) => base[i] + val(d, g.id));
      if (top.some((v, i) => v > base[i])) {
        let d = "";
        s.forEach((p, i) => { d += `${i ? "L" : "M"}${x(p.t).toFixed(1)},${y(top[i]).toFixed(1)}`; });
        for (let i = s.length - 1; i >= 0; i--) d += `L${x(s[i].t).toFixed(1)},${y(base[i]).toFixed(1)}`;
        el("path", { d: d + "Z", fill: g.color, "fill-opacity": g.id === "gas" ? 0.95 : 0.72, stroke: g.color, "stroke-width": 0.6 }, svg);
      }
      if (g.id === "gas") gasTop = s.map((d, i) => [x(d.t), y(top[i])]);
      if (g.id === "wind") windBase = base.slice();
      for (let i = 0; i < s.length; i++) base[i] = top[i];
    }
    // Clip region covering the wind and solar bands, for the provisional hatching
    if (windBase) {
      let cd = "";
      s.forEach((p, i) => { cd += `${i ? "L" : "M"}${x(p.t).toFixed(1)},${y(base[i]).toFixed(1)}`; });
      for (let i = s.length - 1; i >= 0; i--) cd += `L${x(s[i].t).toFixed(1)},${y(windBase[i]).toFixed(1)}`;
      el("path", { d: cd + "Z" }, el("clipPath", { id: "windSolarClip" }, el("defs", {}, svg)));
    }
    // Crisp edge along the top of the gas band
    let edge = "";
    gasTop.forEach(([px, py], i) => { edge += `${i ? "L" : "M"}${px.toFixed(1)},${py.toFixed(1)}`; });
    el("path", { d: edge, fill: "none", stroke: C["gas-edge"], "stroke-width": 1.4 }, svg);
    const firstProv = s.findIndex((d) => d.provisional);
    if (firstProv >= 0) {
      const defs = el("defs", {}, svg);
      const pat = el("pattern", { id: "provHatch", width: 6, height: 6, patternUnits: "userSpaceOnUse", patternTransform: "rotate(45)" }, defs);
      el("rect", { width: 6, height: 6, fill: C["hatch-bg"] }, pat);
      el("line", { x1: 0, y1: 0, x2: 0, y2: 6, stroke: C.hatch, "stroke-width": 2 }, pat);
      const px = firstProv > 0 ? (x(s[firstProv - 1].t) + x(s[firstProv].t)) / 2 : f.m.l;
      const top = f.m.t, h = f.ih, w = f.m.l + f.iw - px;
      // Hatch only the wind and solar bands, which are the estimated part
      el("rect", { x: px, y: top, width: Math.max(0, w), height: h, fill: "url(#provHatch)", "clip-path": "url(#windSolarClip)" }, svg);
      el("line", { x1: px, x2: px, y1: top, y2: top + h, stroke: C.prov, "stroke-dasharray": "3 3" }, svg);
      const lbl = el("text", { x: w > 90 ? px + 6 : px - 6, y: top + 13, "text-anchor": w > 90 ? "start" : "end", class: "hl-text", "paint-order": "stroke", stroke: C.halo, "stroke-width": 4 }, svg);
      lbl.textContent = "Provisional";
    }
    drawHighlight(svg, s, f, gasTop, "#f08a24", (d) => `${state.highlight === "max" ? "Most gas" : "Least gas"} ${pct(d.v)} at ${hm(d.t)}`);
    finishHover(svg, s, f, gasTop, W, "#f08a24");
  }

  function drawHighlight(svg, s, f, pts, color, text) {
    if (!state.highlight) return;
    const sum = summary(s), d = sum[state.highlight], i = s.indexOf(d);
    const [hx, hy] = pts[i], { m, iw, ih } = f;
    el("line", { x1: hx, x2: hx, y1: m.t, y2: m.t + ih, stroke: C.hl, "stroke-dasharray": "2 3" }, svg);
    el("circle", { cx: hx, cy: hy, r: 9, fill: "none", stroke: C.ink, "stroke-width": 1.5 }, svg);
    el("circle", { cx: hx, cy: hy, r: 4, fill: color, stroke: C.hollow, "stroke-width": 1.5 }, svg);
    const ly = hy - 18 > m.t + 4 ? hy - 16 : hy + 24;
    const anchor = hx < m.l + 90 ? "start" : hx > m.l + iw - 90 ? "end" : "middle";
    const lx = hx + (anchor === "start" ? 12 : anchor === "end" ? -12 : 0);
    const label = el("text", { x: lx, y: ly, "text-anchor": anchor, class: "hl-text", "paint-order": "stroke", stroke: C.halo, "stroke-width": 4 }, svg);
    label.textContent = text(d);
  }

  function finishHover(svg, s, f, pts, W, color) {
    const { m, iw, ih } = f;
    const guide = el("line", { y1: m.t, y2: m.t + ih, stroke: C.guide, visibility: "hidden" }, svg);
    const dot = el("circle", { r: 4, fill: color, stroke: C.hollow, "stroke-width": 1.5, visibility: "hidden" }, svg);
    el("rect", { x: m.l, y: m.t, width: iw, height: ih, fill: "transparent" }, svg);
    geom = { s, pts, W, m, iw, guide, dot };
  }

  function nearest(px) {
    const p = geom.pts;
    let lo = 0, hi = p.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (p[mid][0] < px) lo = mid; else hi = mid; }
    return Math.abs(p[lo][0] - px) <= Math.abs(p[hi][0] - px) ? lo : hi;
  }
  function tipHtml(d) {
    if (d.n !== undefined) return tipDaily(d);
    const head = `<div class="t">${shortDate(d.t)}, ${hm(d.t)} (period ${d.period})</div>`;
    if (state.view === "ssp") {
      let extra = "";
      if (state.budget !== null) { const diff = d.v - state.budget; extra = `<div class="${diff >= 0 ? "over" : "under"}">${signedMoney(diff)} vs budget</div>`; }
      return `${head}<div class="v">${money(d.v)}/MWh</div>${extra}`;
    }
    const list = [...GROUPS].reverse().filter((g) => d.g[g.id] > 0)
      .map((g) => `<div class="row${g.id === "gas" ? " gas" : ""}"><i style="background:${g.color}"></i><span class="n">${g.name}</span><span class="x">${pct((d.g[g.id] / d.total) * 100)}</span><span class="m">${mw(d.g[g.id])} MW</span></div>`).join("");
    return `${head}${list}<div class="foot">${mw(d.total)} MW generating${d.exports > 0 ? `, ${mw(d.exports)} MW exporting` : ""}${d.provisional ? "<br>Provisional: wind and solar estimated" : d.full ? "" : "<br>Transmission only, no solar estimate for this period"}</div>`;
  }
  function tipDaily(d) {
    const partial = d.date === todayUK() ? `, to ${hm(d.last.t)}` : "";
    const head = `<div class="t">${shortDate(d.t)}${partial}, ${d.n} periods</div>`;
    if (state.view === "ssp") {
      let extra = "";
      if (state.budget !== null) { const diff = d.v - state.budget; extra = `<div class="${diff >= 0 ? "over" : "under"}">${signedMoney(diff)} vs budget, ${d.above} of ${d.n} periods at or above</div>`; }
      return `${head}<div class="v">${money(d.v)}/MWh average</div><div class="t">Low ${money(d.min.v)} at ${hm(d.min.t)}, high ${money(d.max.v)} at ${hm(d.max.t)}</div>${extra}`;
    }
    const list = [...GROUPS].reverse().filter((g) => d.g[g.id] > 0)
      .map((g) => `<div class="row${g.id === "gas" ? " gas" : ""}"><i style="background:${g.color}"></i><span class="n">${g.name}</span><span class="x">${pct((d.g[g.id] / d.total) * 100)}</span><span class="m">${mw(d.g[g.id])} MW</span></div>`).join("");
    return `${head}${list}<div class="foot">Average MW across the day${d.provisional ? "<br>Includes provisional wind and solar" : ""}</div>`;
  }

  function showTip(evt) {
    if (!geom) return;
    const r = $("chart").getBoundingClientRect(), scale = geom.W / r.width;
    const px = (evt.clientX - r.left) * scale;
    if (px < geom.m.l - 10 || px > geom.m.l + geom.iw + 10) return hideTip();
    const i = nearest(px), d = geom.s[i], [cx, cy] = geom.pts[i];
    geom.guide.setAttribute("x1", cx); geom.guide.setAttribute("x2", cx); geom.guide.setAttribute("visibility", "visible");
    geom.dot.setAttribute("cx", cx); geom.dot.setAttribute("cy", cy); geom.dot.setAttribute("visibility", "visible");
    const tip = $("tip");
    tip.innerHTML = tipHtml(d);
    tip.style.display = "block";
    const wr = $("chartWrap").getBoundingClientRect();
    const sx = cx / scale + (r.left - wr.left), sy = cy / scale + (r.top - wr.top);
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = sx + 14;
    if (left + tw > wr.width - 4) left = sx - tw - 14;
    if (left < 4) left = Math.max(4, Math.min(wr.width - tw - 4, sx - tw / 2));
    let top = sy - th - 12;
    if (top < 0) top = Math.min(sy + 14, wr.height - th);
    tip.style.left = left + "px";
    tip.style.top = Math.max(0, top) + "px";
  }
  function hideTip() {
    $("tip").style.display = "none";
    if (geom) { geom.guide.setAttribute("visibility", "hidden"); geom.dot.setAttribute("visibility", "hidden"); }
  }

  // CSV export of whatever is on screen
  function exportCsv() {
    const s = rows();
    if (!s.length) return;
    const q = (v) => `"${String(v).replace(/"/g, '""')}"`;
    let head, body, daily = false;
    if (showDaily(s)) {
      daily = true;
      const days = dailyRows(s);
      if (state.view === "ssp") {
        head = ["Date", "Periods", "Average SSP (£/MWh)", "Min SSP (£/MWh)", "Min time", "Max SSP (£/MWh)", "Max time", "Net imbalance volume (MWh)", ...(state.budget !== null ? [`Periods at or above budget of £${state.budget}`] : [])];
        body = days.map((d) => [d.date, d.n, d.avg.toFixed(2), d.min.v, hm(d.min.t), d.max.v, hm(d.max.t), Math.round(d.niv), ...(d.above === null ? [] : [d.above])]);
      } else {
        head = ["Date", "Periods", "Gas share (%)", ...GROUPS.map((g) => `${g.name} (average MW)`), "Total generating (average MW)", "Includes provisional wind and solar"];
        body = days.map((d) => [d.date, d.n, d.share.toFixed(2), ...GROUPS.map((g) => Math.round(d.g[g.id])), Math.round(d.total), d.provisional ? "yes" : "no"]);
      }
    } else if (state.view === "ssp") {
      head = ["Date", "Time", "Settlement period", "SSP (£/MWh)", "Net imbalance volume (MWh)", "Price derivation code"];
      body = s.map((d) => [d.date, hm(d.t), d.period, d.v, d.niv ?? "", q(d.code)]);
    } else {
      const fuels = [...new Set(s.flatMap((d) => Object.keys(d.raw)))].sort();
      head = ["Date", "Time", "Settlement period", "Gas share (%)", ...GROUPS.map((g) => `${g.name} (MW)`), "Total generating (MW)", "Exporting (MW)", "Wind and solar provisional", ...fuels.map((f) => `${f} (MW)`)];
      body = s.map((d) => [d.date, hm(d.t), d.period, d.v.toFixed(2), ...GROUPS.map((g) => d.g[g.id]), Math.round(d.total), d.exports, d.provisional ? "yes" : "no", ...fuels.map((f) => d.raw[f] ?? "")]);
    }
    const csv = [head.map(q).join(","), ...body.map((r) => r.join(","))].join("\r\n");
    const first = s[0].date, last = s[s.length - 1].date;
    const stem = (state.view === "ssp" ? "system-sell-price" : "grid-mix") + (daily ? "-daily" : "");
    const name = first === last ? `${stem}-${first}.csv` : `${stem}-${first}-to-${last}.csv`;
    const url = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
  }

  // Budget
  function setBudget(raw, save) {
    const v = raw === "" || raw === null ? null : Number(raw);
    state.budget = v === null || isNaN(v) ? null : v;
    $("clearBudget").hidden = state.budget === null;
    if (save) {
      try {
        if (state.budget === null) localStorage.removeItem("estover.budget");
        else localStorage.setItem("estover.budget", String(state.budget));
      } catch (e) { /* storage unavailable, the budget still works for this visit */ }
    }
    render();
  }

  // Events
  document.querySelectorAll(".seg.prices button").forEach((b) => b.addEventListener("click", () => {
    if (state.view === b.dataset.view) return;
    state.view = b.dataset.view;
    state.highlight = null;
    document.querySelectorAll(".seg.prices button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    load(false);
  }));
  document.querySelectorAll(".seg.periods button").forEach((b) => b.addEventListener("click", () => {
    const r = b.dataset.range;
    document.querySelectorAll(".seg.periods button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    const panel = $("customPanel");
    if (r === "custom") {
      panel.classList.add("open");
      const today = todayUK();
      $("fromDate").max = today; $("toDate").max = today;
      if (!$("fromDate").value) $("fromDate").value = state.from || addDays(today, -6);
      if (!$("toDate").value) $("toDate").value = state.to || today;
      $("fromDate").focus();
      return;
    }
    panel.classList.remove("open");
    state.range = r;
    setMode("daily");
    load(false);
  }));
  $("customPanel").addEventListener("submit", (e) => {
    e.preventDefault();
    const f = $("fromDate").value, t = $("toDate").value, note = $("customNote");
    note.textContent = "";
    if (!f || !t) { note.textContent = "Choose both dates."; return; }
    if (f > t) { note.textContent = "The from date needs to be on or before the to date."; return; }
    if (daysBetween(f, t) + 1 > MAX_CUSTOM_DAYS) { note.textContent = `Choose ${MAX_CUSTOM_DAYS} days or fewer.`; return; }
    state.range = "custom"; state.from = f; state.to = t;
    setMode("daily");
    load(false);
  });
  function setMode(mode) {
    state.tableMode = mode;
    state.highlight = null;
    document.querySelectorAll(".gran button").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.mode === mode)));
  }
  document.querySelectorAll(".gran button").forEach((b) => b.addEventListener("click", () => { setMode(b.dataset.mode); render(); }));
  document.querySelectorAll("#unitsBox button").forEach((b) => b.addEventListener("click", () => {
    state.units = b.dataset.units;
    document.querySelectorAll("#unitsBox button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    drawChart();
  }));
  function pick(b) {
    state.highlight = state.highlight === b.dataset.hl ? null : b.dataset.hl;
    render();
    if (state.highlight) {
      const panel = $("chartWrap").closest(".panel"), r = panel.getBoundingClientRect();
      if (r.top < 0 || r.bottom > window.innerHeight) panel.scrollIntoView({ block: "nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    }
    const again = document.querySelector(`[data-hl="${b.dataset.hl}"]`);
    if (again && document.activeElement === document.body) again.focus({ preventScroll: true });
  }
  $("stats").addEventListener("click", (e) => { const b = e.target.closest("[data-hl]"); if (b) pick(b); });
  $("stats").addEventListener("keydown", (e) => {
    const b = e.target.closest("[data-hl]");
    if (b && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); pick(b); }
  });
  $("budget").addEventListener("input", (e) => setBudget(e.target.value, true));
  $("clearBudget").addEventListener("click", () => { $("budget").value = ""; setBudget("", true); $("budget").focus(); });
  $("refreshBtn").addEventListener("click", () => load(true));
  $("exportBtn").addEventListener("click", exportCsv);
  const cw = $("chartWrap");
  cw.addEventListener("pointermove", showTip);
  cw.addEventListener("pointerdown", showTip);
  cw.addEventListener("pointerleave", hideTip);
  let lastW = 0;
  new ResizeObserver(() => { const w = cw.clientWidth; if (Math.abs(w - lastW) > 2) { lastW = w; drawChart(); } }).observe(cw);

  // Start
  // redraw in the right colours when the device switches between light and dark
  try { matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => render()); } catch (e) {}
  try { const saved = localStorage.getItem("estover.budget"); if (saved) $("budget").value = saved; } catch (e) {}
  state.budget = $("budget").value === "" ? null : Number($("budget").value);
  $("clearBudget").hidden = state.budget === null;
  load(true);
})();
</script>
</body>
</html>
